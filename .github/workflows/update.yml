name: Update XML Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch XML from Google Apps Script
        run: |
          curl -L -s -o feed.xml "https://script.google.com/macros/s/AKfycbyH9kmHeeStcPlS4l49vNsOlR7N1LCzyiusFxTDvjI_Rw-sCDZwIEJ-iPwQP9BO4xiA/exec"
          if grep -q "<Ads" feed.xml; then
            echo "XML is valid"
          else
            echo "Invalid XML downloaded"
            cat feed.xml
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Auto-update XML feed" || echo "No changes to commit"
          git push
